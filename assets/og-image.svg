<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#1a3a5c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e8d48b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="570" rx="16" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.3"/>
  <!-- Card fan silhouettes -->
  <g transform="translate(600,280)" opacity="0.15">
    <rect x="-120" y="-140" width="80" height="140" rx="6" fill="#c9a84c" transform="rotate(-20)"/>
    <rect x="-40" y="-145" width="80" height="140" rx="6" fill="#c9a84c" transform="rotate(-7)"/>
    <rect x="40" y="-145" width="80" height="140" rx="6" fill="#c9a84c" transform="rotate(7)"/>
    <rect x="120" y="-140" width="80" height="140" rx="6" fill="#c9a84c" transform="rotate(20)"/>
  </g>
  <!-- Title -->
  <text x="600" y="270" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="96" font-weight="bold" fill="url(#gold)">Treseta</text>
  <text x="600" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#c9a84c" opacity="0.8">Igra na karata</text>
  <!-- Subtitle -->
  <text x="600" y="410" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" fill="#8aa8c8">Tradicionalna dalmatinska kartaška igra</text>
  <text x="600" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#6a88a8">Dubrovačka pravila | Talijanske karte Triestine</text>
  <!-- Domain -->
  <text x="600" y="550" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#c9a84c">treseta.com.hr</text>
</svg>
